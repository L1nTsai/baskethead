name: CI (lint only)

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run on the same branch when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          xcrun swift-format --version

      - name: Lint (swift-format)
        run: xcrun swift-format lint --strict --recursive ios

      # TODO: build and test are off. The project was created with Xcode 27, which saves
      # project.xcproj. GitHub's runners top out at Xcode 26.6, which cannot open it
      # ("missing its project.pbxproj file"). Re-enable when runners have Xcode 27:
      # pick an iPhone simulator, then run
      #   xcodebuild test -project ios/Baskethead.xcodeproj -scheme Baskethead \
      #     -destination "platform=iOS Simulator,id=<udid>"
      # Until then, run the tests locally before every PR.
